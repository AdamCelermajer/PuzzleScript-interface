<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pseudocode card template</title>
  <style>
    :root {
      --bg: #f7f8f5;
      --ink: #1c2520;
      --muted: #5b6760;
      --line: #cfd6ce;
      --panel: #ffffff;
      --mono: Consolas, "SFMono-Regular", "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.45;
    }

    .code-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    article {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    article header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 0;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfa;
    }

    h3 {
      margin: 0;
      font-size: 0.95rem;
      letter-spacing: 0;
    }

    .path {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.76rem;
      text-align: right;
      overflow-wrap: anywhere;
    }

    article.wide {
      grid-column: 1 / -1;
    }

    .algorithm-card {
      border-color: #1c2520;
      background: #ffffff;
    }

    .algorithm-card header {
      border-bottom: 0;
      background: #ffffff;
    }

    .pseudocode {
      margin: 0 12px 12px;
      border-top: 2px solid #1c2520;
      border-bottom: 1px solid #1c2520;
      background: #ffffff;
      color: #111713;
      font-family: Georgia, "Cambria Math", "Segoe UI Symbol", "Noto Serif Math", "Latin Modern Math", "Times New Roman", serif;
      counter-reset: line;
      padding: 8px 0 10px;
    }

    .pseudocode-title {
      padding: 4px 12px 6px;
      border-bottom: 1px solid #1c2520;
      font-size: 1.02rem;
      font-variant: small-caps;
      letter-spacing: 0;
    }

    .pseudocode-title strong {
      font-variant: normal;
      font-weight: 800;
    }

    .pseudocode-title code {
      font-size: 0.82rem;
    }

    .pseudocode-line {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      padding: 2px 12px;
      counter-increment: line;
      font-size: 1rem;
      line-height: 1.55;
    }

    .pseudocode-line::before {
      content: counter(line);
      font-family: var(--mono);
      font-size: 0.78rem;
      color: #888;
      width: 1.5rem;
      text-align: right;
      flex-shrink: 0;
    }

    .pseudocode-stmt {
      flex: 1 1 auto;
      min-width: 0;
      white-space: pre-wrap;
      word-break: normal;
      overflow-wrap: anywhere;
      tab-size: 4;
      font-family: Georgia, "Cambria Math", "Segoe UI Symbol", "Noto Serif Math", "Latin Modern Math", "Times New Roman", serif;
    }

    .pseudocode-comment {
      flex: 0 0 auto;
      max-width: 46%;
      color: #5b6760;
      font-family: var(--sans);
      font-size: 0.82rem;
      text-align: right;
    }

    @media (max-width: 820px) {
      .code-grid {
        grid-template-columns: 1fr;
      }

      .pseudocode-line {
        flex-wrap: wrap;
        gap: 0.1rem 0.5rem;
      }

      .pseudocode-comment {
        max-width: 100%;
        width: 100%;
        text-align: left;
        padding-left: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="code-grid">
    <!-- Wide card: add class="wide" to the article -->
    <article class="algorithm-card wide">
      <header>
        <h3>Algorithm name</h3>
        <span class="path">path/to/file.py</span>
      </header>
      <div class="pseudocode">
        <div class="pseudocode-title"><strong>Role</strong> One-line description</div>

        <!-- One line. Add / omit the comment span as needed. -->
        <div class="pseudocode-line">
          <span class="pseudocode-stmt"><var>x</var> ← init()</span>
          <span class="pseudocode-comment">inline note</span>
        </div>

        <div class="pseudocode-line">
          <span class="pseudocode-stmt"><strong>while</strong> running <strong>do</strong></span>
        </div>

        <!-- Indent with spaces inside the stmt span. -->
        <div class="pseudocode-line">
          <span class="pseudocode-stmt">    y ← step(x)</span>
        </div>
      </div>
    </article>
  </div>
</body>
</html>
