<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Runs · Research Workbench</title>
  <link rel="stylesheet" href="/src/style.css">
  <link rel="stylesheet" href="/src/runs.css">
  <link rel="stylesheet" href="/src/active-runs.css">
</head>
<body>
  <main class="runs-page live-page" data-active-runs>
    <header class="runs-header">
      <div><p class="eyebrow">Research Workbench / Live activity</p><h1>Runs</h1><p>Active experiments · newest first · paired runs kept together.</p></div>
      <div class="runs-actions"><a class="button" href="/runs/mechanics.html">Three-game study</a><a class="button" href="/runs/results.html">View results</a><a class="button primary" href="/runs/new.html">New campaign</a></div>
    </header>
    <div class="live-toolbar">
      <div class="live-counts" data-live-counts aria-live="polite">Checking active experiments…</div>
      <div class="runs-actions"><span class="service-line" data-services>Connecting…</span><button type="button" data-refresh>Refresh</button></div>
    </div>
    <div class="run-notice" data-notice role="status" hidden></div>
    <div data-live-launches><p class="live-empty">Loading live activity…</p></div>
    <section id="saved-runs" class="live-saved" data-saved-runs hidden></section>
  </main>
  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/active-runs.js"></script>
</body>
</html>
