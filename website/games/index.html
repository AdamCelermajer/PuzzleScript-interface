<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benchmark library · Research Workbench</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/game-library.css"></head>
<body data-section="games"><main class="game-library" data-library>
<header class="library-heading"><div><p class="eyebrow">RESEARCH WORKBENCH / GAMES</p><h1>Benchmark library<span>.</span></h1><p>Play the puzzles. Explore what we learned.</p></div><button class="quiet-button" data-nav-toggle aria-expanded="false">Workbench menu</button></header>
<div class="library-notice" data-notice role="alert" hidden></div>
<div class="library-layout">
<details class="game-menu" open><summary>Game library <span data-library-count></span></summary><div class="game-menu-body"><label class="sr-only" for="game-search">Find a game</label><input id="game-search" type="search" data-search placeholder="Find a game…"><label class="sr-only" for="collection">Benchmark collection</label><select id="collection" data-collection><option value="current">Current benchmark</option><option value="all">All benchmark collections</option></select><nav data-game-list aria-label="Benchmark games"><p>Loading games…</p></nav></div></details>
<div class="game-content" data-game-content><div class="library-empty">Choose a game to explore.</div></div>
</div></main><script type="module" src="/src/main.js"></script><script type="module" src="/src/game-library.js"></script></body></html>
