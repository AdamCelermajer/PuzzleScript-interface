[project]
name = "puzzlescript-interface"
version = "1.0.0"
description = "Research framework for LLM agents that learn puzzle game mechanics by observing state transitions."
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "requests",
    "arc-agi",
    "openai",
    "openai-codex>=0.159.2",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "pypdf",
    "backports-zstd>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "harness2 @ git+https://github.com/google-research/harness2.git@1cfe254e8d25b15f37048c3730134686abe60335 ; python_version >= '3.12' and python_version < '3.14'",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "frameworks"]
pythonpath = ["."]
