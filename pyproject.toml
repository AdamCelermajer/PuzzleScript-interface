[project]
name = "puzzlescript-interface"
version = "1.0.0"
description = "Research framework for LLM agents that learn puzzle game mechanics by observing state transitions."
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "requests",
    "arc-agi",
    "openai",
    "openai-codex>=0.159.2",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "pypdf",
    "backports-zstd>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.uv]
package = false
